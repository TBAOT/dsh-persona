<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="dsh-persona 面板：左侧角色脊、右侧记忆正文、页脚容量与召回读数">
  <rect width="1200" height="675" fill="#faf9f6"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#e4dfd4"/>

  <!-- 左侧：角色脊 -->
  <rect x="24" y="24" width="248" height="627" fill="#f5f2ec" stroke="#e4dfd4"/>
  <text x="48" y="66" font-family="Georgia, 'Songti SC', serif" font-size="15" fill="#1d1d1b" letter-spacing="0.06em">dsh-persona</text>
  <text x="48" y="86" font-family="Georgia, 'Songti SC', serif" font-size="11" fill="#8a8578">每个角色一份记忆</text>
  <line x1="48" y1="104" x2="248" y2="104" stroke="#e4dfd4"/>

  <g font-family="Georgia, 'Songti SC', serif">
    <text x="48" y="140" font-size="11" fill="#b9b2a4">01</text>
    <text x="76" y="140" font-size="14" fill="#1d1d1b">助手</text>
    <text x="76" y="158" font-size="10.5" fill="#8a8578">1 个工作区</text>

    <text x="48" y="196" font-size="11" fill="#b9b2a4">02</text>
    <text x="76" y="196" font-size="14" fill="#1d1d1b">项目 A</text>
    <text x="76" y="214" font-size="10.5" fill="#8a8578">1 个工作区</text>

    <text x="48" y="252" font-size="11" fill="#b9b2a4">03</text>
    <text x="76" y="252" font-size="14" fill="#1d1d1b">项目 B</text>
    <text x="76" y="270" font-size="10.5" fill="#8a8578">1 个工作区</text>
  </g>

  <!-- 右侧：文档 -->
  <text x="304" y="66" font-family="Georgia, 'Songti SC', serif" font-size="21" fill="#1d1d1b">记忆正文</text>
  <text x="304" y="88" font-family="Georgia, 'Songti SC', serif" font-size="11.5" fill="#8a8578">一条一个事实 · 结论留在这里，过程进主题库</text>

  <!-- 页签 -->
  <g font-family="Georgia, 'Songti SC', serif" font-size="12.5">
    <text x="304" y="122" fill="#1d1d1b">角色记忆</text>
    <line x1="304" y1="130" x2="360" y2="130" stroke="#1d1d1b" stroke-width="1.5"/>
    <text x="392" y="122" fill="#8a8578">用户画像</text>
    <text x="470" y="122" fill="#8a8578">复盘记录</text>
    <text x="548" y="122" fill="#8a8578">技能</text>
    <text x="602" y="122" fill="#8a8578">工作区</text>
    <text x="900" y="122" fill="#8a8578" font-size="11.5">只读</text>
    <text x="936" y="122" fill="#1d1d1b" font-size="11.5" text-decoration="underline dotted">画像</text>
    <text x="974" y="122" fill="#1d1d1b" font-size="11.5" text-decoration="underline dotted">笔记</text>
    <text x="1012" y="122" fill="#1d1d1b" font-size="11.5" text-decoration="underline dotted">主题</text>
    <text x="1060" y="122" fill="#8a8578" font-size="11.5">撤销</text>
    <rect x="1100" y="106" width="52" height="24" fill="#f5f2ec" stroke="#d6cfc0"/>
    <text x="1112" y="122" fill="#1d1d1b" font-size="11.5">保存</text>
  </g>
  <line x1="304" y1="140" x2="1176" y2="140" stroke="#e4dfd4"/>

  <!-- 条目 -->
  <g font-family="Georgia, 'Songti SC', serif" font-size="12.5" fill="#1d1d1b">
    <text x="304" y="172">环境：应用装在 C:\work\DeepSeekHarness；插件源码在独立仓库；命令一律 pnpm。</text>
    <text x="304" y="200" fill="#b9b2a4">§</text>
    <text x="304" y="228">记忆模型：两档常驻（画像 / 笔记），首次拼提示词时冻结；细节进主题库。</text>
    <text x="304" y="256" fill="#b9b2a4">§</text>
    <text x="304" y="284">容量：常驻 ≥90% 时新增转存主题；单条 ≤120 字，一条一个事实。</text>
    <text x="304" y="312" fill="#b9b2a4">§</text>
    <text x="304" y="340">召回：每轮取前 3 篇主题摘要注入运行时上下文，不进你的消息。</text>
    <text x="304" y="368" fill="#b9b2a4">§</text>
    <text x="304" y="396">只读：把某一档设为只读后，agent 不能再写；面板仍可编辑。</text>
  </g>

  <!-- 页脚 -->
  <line x1="24" y1="600" x2="1176" y2="600" stroke="#e4dfd4"/>
  <rect x="24" y="618" width="300" height="8" fill="#e4dfd4"/>
  <rect x="24" y="618" width="204" height="8" fill="#1d1d1b"/>
  <g font-family="Georgia, 'Songti SC', serif" font-size="11.5" fill="#8a8578">
    <text x="344" y="626">2 028 / 3 000 字符 68%</text>
    <text x="510" y="626">上限</text>
    <rect x="540" y="612" width="72" height="20" fill="#faf9f6" stroke="#d6cfc0"/>
    <text x="552" y="626" fill="#1d1d1b">3 000</text>
    <text x="632" y="626">应用</text>
    <text x="700" y="626">记 29 条 · 主题 25</text>
    <text x="838" y="626">召回 3 篇 / 171 字符</text>
    <text x="1010" y="626">已保存</text>
    <text x="1080" y="626" font-size="10.5">~\ .dsh \ personas \ …</text>
  </g>
</svg>
